<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/style.css" />
        <title>thegrid</title>
    </head>
    <body>
        <div id="controls">
            <div class="control">
                <h2>Theme</h2>
                <label style="margin-right: 1rem"><input type="radio" name="color-scheme" value="light" /> Light</label>
                <label><input type="radio" name="color-scheme" value="dark" checked /> Dark</label>
            </div>
            <div class="control cell-size">
                <h2>Cell size</h2>
                <label>
                    <input class="slider" type="range" name="cell-size" min="20" max="150" value="50" step="10" />
                    <span class="value">50</span>
                </label>
            </div>
            <div class="control show-headers">
                <h2>Show headers</h2>
                <label>
                    <select class="dropdown">
                        <option value="both" selected>Both</option>
                        <option value="columns">Columns only</option>
                        <option value="rows">Rows only</option>
                        <option value="none">None</option>
                    </select>
                </label>
            </div>
            <div class="control header-selection">
                <h2>Header selection</h2>
                <label>
                    <select class="dropdown">
                        <option value="both" selected>Both</option>
                        <option value="columns">Columns only</option>
                        <option value="rows">Rows only</option>
                        <option value="none">None</option>
                    </select>
                </label>
            </div>
        </div>
        <div id="app">
            <div class="grid"></div>
        </div>
        <script type="module" src="./app.ts"></script>
    </body>
</html>
